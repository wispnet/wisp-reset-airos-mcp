services:
  dfs-reset:
    build: .
    container_name: dfs-reset
    command: ["python", "server.py", "--http", "--port", "8080"]
    ports:
      - "127.0.0.1:18083:8080"
    volumes:
      - ./config.json:/app/config.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dfs-reset-net

networks:
  dfs-reset-net:
    name: dfs-reset-net
